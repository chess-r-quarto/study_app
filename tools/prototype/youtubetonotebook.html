<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube URL Formatter</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (Production versions for stability) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (Stable version) -->
  <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>

  <style>
    /* Custom scrollbar for textareas to maintain aesthetic */
    textarea::-webkit-scrollbar {
      width: 8px;
    }
    textarea::-webkit-scrollbar-track {
      background: #161512; 
      border-radius: 4px;
    }
    textarea::-webkit-scrollbar-thumb {
      background: #302e2b; 
      border-radius: 4px;
    }
    textarea::-webkit-scrollbar-thumb:hover {
      background: #403d39; 
    }
  </style>
</head>
<body class="bg-[#161512] min-h-screen text-[#bababa] p-4 sm:p-8 font-sans selection:bg-[#629924] selection:text-white">
  <div id="root"></div>

  <script>
    // Register custom Babel preset for TSX compilation in the browser
    Babel.registerPreset('tsx', {
      presets: [
        [Babel.availablePresets['typescript'], { isTSX: true, allExtensions: true }],
        Babel.availablePresets['react']
      ]
    });
  </script>

  <script type="text/babel" data-presets="tsx">
    const { useState, useRef } = React;

    /**
     * Main Application Component
     */
    function App() {
      const [input, setInput] = useState<string>('');
      const [output, setOutput] = useState<string>('');
      const [isCopied, setIsCopied] = useState<boolean>(false);
      
      const outputRef = useRef<HTMLTextAreaElement>(null);

      /**
       * Formats the input string by splitting on %0A, spaces, or actual newlines,
       * and joins them back with clean newlines.
       */
      const handleFormat = () => {
        // Regex matches %0A (case-insensitive), standard newlines, or spaces
        const formatted = input
          .split(/(?:%0A|\n|\s)+/i)
          .filter((line) => line.trim() !== '')
          .join('\n');
          
        setOutput(formatted);
        setIsCopied(false);
      };

      /**
       * Clears both input and output fields.
       */
      const handleClear = () => {
        setInput('');
        setOutput('');
        setIsCopied(false);
      };

      /**
       * Copies the formatted output to the clipboard using execCommand
       * for broader iframe compatibility.
       */
      const handleCopy = () => {
        if (!outputRef.current || !output) return;
        
        outputRef.current.select();
        outputRef.current.setSelectionRange(0, 99999); // Ensure mobile compatibility
        
        try {
          // Using execCommand as per environment constraint guidelines
          document.execCommand('copy');
          setIsCopied(true);
          
          // Reset copy status after 2 seconds
          setTimeout(() => {
            setIsCopied(false);
          }, 2000);
        } catch (err) {
          console.error('Failed to copy text', err);
        }
      };

      return (
        <div className="max-w-4xl mx-auto bg-[#262421] rounded-2xl shadow-2xl overflow-hidden border border-[#302e2b]">
          <div className="bg-[#201e1b] px-6 py-4 border-b border-[#302e2b]">
            <h1 className="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-[#bababa]" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
              </svg>
              URL List Formatter
            </h1>
          </div>

          <div className="p-6 sm:p-8 flex flex-col md:flex-row gap-6">
            {/* Input Section */}
            <div className="flex-1 flex flex-col gap-3">
              <label htmlFor="input-urls" className="font-semibold text-[#bababa]">
                Extracted Text (Input)
              </label>
              <textarea
                id="input-urls"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                placeholder="https://www.youtube.com/...%0Ahttps://www.youtube.com/..."
                className="w-full h-64 sm:h-96 p-4 bg-[#161512] border border-[#302e2b] text-[#bababa] rounded-xl focus:ring-1 focus:ring-[#629924] focus:border-[#629924] outline-none transition-all resize-none font-mono text-sm placeholder-[#403d39]"
                spellCheck="false"
              />
              <div className="flex gap-3 mt-2">
                <button
                  onClick={handleFormat}
                  disabled={!input}
                  className="flex-1 bg-[#629924] hover:bg-[#53821f] text-white font-medium py-3 px-4 rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fillRule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clipRule="evenodd" />
                  </svg>
                  Format URLs
                </button>
                <button
                  onClick={handleClear}
                  disabled={!input && !output}
                  className="bg-[#302e2b] hover:bg-[#3d3a36] text-[#bababa] font-medium py-3 px-4 rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  Clear
                </button>
              </div>
            </div>

            {/* Output Section */}
            <div className="flex-1 flex flex-col gap-3">
              <label htmlFor="output-urls" className="font-semibold text-[#bababa]">
                Formatted Text (Output)
              </label>
              <textarea
                id="output-urls"
                ref={outputRef}
                value={output}
                readOnly
                placeholder="Formatted URLs will appear here"
                className="w-full h-64 sm:h-96 p-4 bg-[#161512] border border-[#302e2b] rounded-xl outline-none resize-none font-mono text-sm text-[#bababa] placeholder-[#403d39]"
              />
              <div className="mt-2">
                <button
                  onClick={handleCopy}
                  disabled={!output}
                  className={`w-full font-medium py-3 px-4 rounded-xl transition-all flex justify-center items-center gap-2 ${
                    isCopied 
                      ? 'bg-[#243615] text-[#74b82a] border border-[#629924]' 
                      : 'bg-[#302e2b] hover:bg-[#3d3a36] text-[#bababa] disabled:opacity-50 disabled:cursor-not-allowed'
                  }`}
                >
                  {isCopied ? (
                    <>
                      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                      </svg>
                      Copied!
                    </>
                  ) : (
                    <>
                      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                        <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                      </svg>
                      Copy Result
                    </>
                  )}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
