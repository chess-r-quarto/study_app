<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study App Navigator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.25.4/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // Babel Configuration for TSX
        Babel.registerPreset('tsx', {
            presets: [
                [Babel.availablePresets['typescript'], { isTSX: true, allExtensions: true }],
                Babel.availablePresets['react']
            ]
        });
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #e0e0e0;
            margin: 0;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #4B5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6B7280;
        }
    </style>
</head>

<body class="h-screen w-screen flex">
    <div id="root" class="w-full h-full flex"></div>

    <script type="text/babel" data-presets="tsx">
        const { useState, useEffect } = React;

        interface AppItem {
            id: string;
            name: string;
            category: string;
            description: string;
            icon: string;
            appUrl: string;
            manualUrl: string;
            installed: boolean;
        }

        const APP_DATA: AppItem[] = [
            // --- Development & Utilities ---
            { id: "dev-tools-hub", category: "Dev & Utilities", name: "Tools Hub (Vite)", description: "Unified TS/React app containing HTML/PDF/Wiki to MD, JSON tools, and Legal Compiler.", icon: "Wrench", appUrl: "tools_app/dist/index.html", manualUrl: "tools_app/public/manuals/html_to_md_manual.html", installed: true },

            // --- Data & Language ---
            { id: "data-1", category: "Data & Language", name: "Data Management", description: "Data management and cleansing operations", icon: "Database", appUrl: "data_management/data_management.html", manualUrl: "data_management/data_management_manual.html", installed: true },


            // --- English Learning ---
            { id: "lang-4", category: "Data & Language", name: "English Card", description: "English flashcard application", icon: "Languages", appUrl: "english_card/english_card.html", manualUrl: "english_card/english_card_manual.html", installed: true },
            { id: "lang-5", category: "Data & Language", name: "English Quiz", description: "English word quizzes", icon: "HelpCircle", appUrl: "english_card/english_quiz.html", manualUrl: "english_card/english_quiz_manual.html", installed: true },
            { id: "lang-6", category: "Data & Language", name: "Grammar Basic", description: "Basic English grammar", icon: "Type", appUrl: "english_card/grammar.html", manualUrl: "english_card/grammar_manual.html", installed: true },
            { id: "lang-7", category: "Data & Language", name: "Grammar (High School)", description: "High-school level grammar", icon: "GraduationCap", appUrl: "english_card/grammar_high_school.html", manualUrl: "english_card/grammar_high_school_manual.html", installed: true },
            { id: "lang-8", category: "Data & Language", name: "Grammar Structure", description: "Sentence structure learning", icon: "Network", appUrl: "english_card/grammar_structure.html", manualUrl: "english_card/grammar_structure_manual.html", installed: true },
            { id: "lang-9", category: "Data & Language", name: "Syntax as Code", description: "Learn syntax analytically", icon: "Code", appUrl: "english_card/syntax_as_code.html", manualUrl: "english_card/syntax_as_code_manual.html", installed: true },
            { id: "lang-10", category: "Data & Language", name: "Syntax Parser", description: "Syntactical sentence parser", icon: "SearchCode", appUrl: "english_card/syntax_parser.html", manualUrl: "english_card/syntax_parser_manual.html", installed: true },
            { id: "lang-12", category: "Data & Language", name: "Grammar Verb", description: "English verb grammar", icon: "Type", appUrl: "english_card/grammar_verb.html", manualUrl: "english_card/grammar_verb_manual.html", installed: true },
            { id: "lang-13", category: "Data & Language", name: "Grammar Term", description: "Grammar terminology", icon: "BookText", appUrl: "english_card/grammar_term.html", manualUrl: "english_card/grammar_term_manual.html", installed: true },
            { id: "lang-14", category: "Data & Language", name: "Grammar Puzzle", description: "Grammar learning puzzle", icon: "Puzzle", appUrl: "english_card/grammar_puzzle.html", manualUrl: "english_card/grammar_puzzle_manual.html", installed: true },
            { id: "lang-21", category: "Data & Language", name: "Grammar Puzzle TS", description: "Grammar learning puzzle (TypeScript)", icon: "Puzzle", appUrl: "grammar_puzzle_ts/dist/index.html", manualUrl: "english_card/grammar_puzzle_manual.html", installed: true },
            { id: "lang-15", category: "Data & Language", name: "Modifiers", description: "Learn English modifiers", icon: "TextSelect", appUrl: "english_card/modifiers.html", manualUrl: "english_card/modifiers_manual.html", installed: true },
            { id: "lang-11", category: "Data & Language", name: "No M Sentence", description: "No Modifier sentence learning", icon: "BookOpen", appUrl: "english_card/no_m_sentence.html", manualUrl: "english_card/no_m_sentence_manual.html", installed: true },
            { id: "lang-16", category: "Data & Language", name: "No M Puzzle", description: "No Modifier puzzle", icon: "Puzzle", appUrl: "english_card/no_m_puzzle.html", manualUrl: "english_card/no_m_puzzle_manual.html", installed: true },
            { id: "lang-17", category: "Data & Language", name: "Countable Nouns", description: "Countable Nouns Quiz", icon: "BookOpen", appUrl: "english_card/countable_nouns.html", manualUrl: "english_card/countable_nouns_manual.html", installed: true },
            { id: "lang-18", category: "Data & Language", name: "English Word App", description: "English Word App", icon: "Languages", appUrl: "english_card/english_word_app.html", manualUrl: "english_card/english_word_app_manual.html", installed: true },
            { id: "lang-19", category: "Data & Language", name: "Grammar Train", description: "English Grammar Train Map", icon: "Map", appUrl: "english_card/grammar_train.html", manualUrl: "english_card/grammar_train_manual.html", installed: true },
            { id: "lang-20", category: "Data & Language", name: "English Word App TS", description: "English Word App (TypeScript)", icon: "Languages", appUrl: "english_word_ts/dist/index.html", manualUrl: "english_card/english_word_app_manual.html", installed: true },

            // --- Mathematics ---
            { id: "math-1", category: "Mathematics", name: "Mathchess", description: "Mathematical Symbol Quiz", icon: "Calculator", appUrl: "math/math_quiz.html", manualUrl: "math/math_quiz_manual.html", installed: true },
            { id: "math-2", category: "Mathematics", name: "Stat Graecia", description: "Statistics Greek Letters Quiz", icon: "Calculator", appUrl: "math/stat_graecia.html", manualUrl: "math/stat_graecia_manual.html", installed: true },

            // --- FP1 (Financial Planning) ---
            { id: "fp1-1", category: "FP1", name: "Dividend Calc", description: "Dividend calculation tool", icon: "Calculator", appUrl: "fp1/fp1_dividend_calc.html", manualUrl: "fp1/fp1_dividend_calc_manual.html", installed: true },
            { id: "fp1-2", category: "FP1", name: "Corporate Tax Matrix", description: "Corporate tax master matrix", icon: "Landmark", appUrl: "fp1/fp1_cor_tax_matrix.html", manualUrl: "fp1/fp1_cor_tax_matrix_manual.html", installed: true },
            { id: "fp1-3", category: "FP1", name: "FP1 FAR", description: "Floor Area Ratio calculations", icon: "Building2", appUrl: "fp1/fp1_far.html", manualUrl: "fp1/fp1_far_manual.html", installed: true },
            { id: "fp1-4", category: "FP1", name: "FP1 Pension", description: "Pension simulation logic", icon: "Users", appUrl: "fp1/fp1_pension.html", manualUrl: "fp1/fp1_pension_manual.html", installed: true },
            { id: "fp1-5", category: "FP1", name: "FP1 Portfolio", description: "Portfolio management and math formulas", icon: "PieChart", appUrl: "fp1/fp1_portfolio.html", manualUrl: "fp1/fp1_portfolio_manual.html", installed: true },
            { id: "fp1-6", category: "FP1", name: "Asset Value", description: "Asset valuation tool", icon: "Gem", appUrl: "fp1/fp1_asset_value.html", manualUrl: "fp1/fp1_asset_value_manual.html", installed: true },
            { id: "fp1-7", category: "FP1", name: "Sell & Buy", description: "Trading sell/buy simulation", icon: "TrendingUp", appUrl: "fp1/fp1_sell_buy.html", manualUrl: "fp1/fp1_sell_buy_manual.html", installed: true },
            { id: "fp1-8", category: "FP1", name: "Inheritance", description: "Inheritance tax estimation", icon: "ScrollText", appUrl: "fp1/fp1_souzoku.html", manualUrl: "fp1/fp1_souzoku_manual.html", installed: true },
            { id: "fp1-9", category: "FP1", name: "Small Scale Land Tax Relief", description: "Small-scale land tax relief calculations", icon: "Map", appUrl: "fp1/fp1_small-scale-land-tax-relief.html", manualUrl: "fp1/fp1_small-scale-land-tax-relief_manual.html", installed: true },
            { id: "fp1-10", category: "FP1", name: "Analysis", description: "FP1 Analysis tools", icon: "LineChart", appUrl: "fp1/analysis.html", manualUrl: "fp1/analysis_manual.html", installed: true },
            { id: "fp1-11", category: "FP1", name: "Static", description: "FP1 Static tools", icon: "FileCode", appUrl: "fp1/static.html", manualUrl: "fp1/static_manual.html", installed: true }
        ];

        const TabItem = ({ icon, label, active = false, onClick }: { icon: string, label: string, active?: boolean, onClick?: () => void }) => {
            useEffect(() => { lucide.createIcons(); });
            return (
                <div onClick={onClick} className={`flex items-center px-4 h-full cursor-pointer transition-colors whitespace-nowrap border-b-2 ${active ? 'border-green-500 text-white bg-[#2a2a2b]' : 'border-transparent text-gray-400 hover:bg-[#2a2a2b] hover:text-gray-200'}`}>
                    <i data-lucide={icon} className={`w-4 h-4 mr-2 ${active ? 'text-green-500' : ''}`}></i>
                    <span className="text-sm font-medium">{label}</span>
                </div>
            );
        };

        const AppCard = ({ app }: { app: AppItem }) => {
            useEffect(() => { lucide.createIcons(); });
            return (
                <div className="bg-[#252526] rounded-lg border border-[#3e3e42] p-5 flex flex-col h-72 hover:border-[#555555] transition-colors shadow-sm group">
                    <div className="flex flex-col items-center mb-4 shrink-0">
                        <div className="w-14 h-14 bg-[#333333] rounded-full flex items-center justify-center mb-3 text-green-500 shadow-inner group-hover:scale-105 transition-transform">
                            <i data-lucide={app.icon} className="w-7 h-7"></i>
                        </div>
                        <h3 className="text-base font-bold text-white text-center leading-tight">{app.name}</h3>
                        <span className="text-xs text-gray-400 mt-1">{app.category}</span>
                    </div>

                    <p className="text-xs text-gray-300 text-center flex-grow overflow-hidden line-clamp-3 leading-relaxed">
                        {app.description}
                    </p>

                    <div className="mt-4 flex flex-col gap-2 w-full shrink-0">
                        {app.installed ? (
                            <>
                                <a href={app.appUrl} className="w-full flex justify-center items-center bg-[#0e639c] hover:bg-[#1177bb] text-white text-sm font-medium py-1.5 rounded transition-colors shadow-sm no-underline">
                                    <i data-lucide="play" className="w-4 h-4 mr-2"></i>Launch
                                </a>
                                <a href={app.manualUrl} className="w-full flex justify-center items-center bg-[#333333] hover:bg-[#444444] text-[#cccccc] hover:text-white text-sm font-medium py-1.5 rounded transition-colors border border-[#444444] no-underline">
                                    <i data-lucide="book-open" className="w-4 h-4 mr-2"></i>Manual (.md)
                                </a>
                            </>
                        ) : (
                            <button className="w-full bg-[#3c3c3c] hover:bg-[#4a4a4a] text-white text-sm font-medium py-2 rounded transition-colors border border-[#555555]">
                                Install
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeCategory, setActiveCategory] = useState < string > ("All");

            const categories = ["All", ...Array.from(new Set(APP_DATA.map(app => app.category)))];
            const filteredApps = activeCategory === "All" ? APP_DATA : APP_DATA.filter(app => app.category === activeCategory);

            return (
                <div className="flex flex-col w-full h-full bg-[#1e1e1e]">

                    {/* Top Navigation Bar */}
                    <div className="w-full bg-[#181818] border-b border-[#333333] flex flex-col shrink-0">
                        <div className="h-16 flex items-center px-4 md:px-6">
                            <div className="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center mr-3 shadow-md shrink-0">
                                <span className="text-white font-bold text-lg leading-none">N</span>
                            </div>
                            <span className="text-lg font-bold tracking-wide text-gray-100 mr-6 shrink-0 hidden sm:block">Study App</span>
                            
                            {/* Scrollable Tabs */}
                            <div className="flex-1 flex h-full overflow-x-auto items-center" style={{ scrollbarWidth: 'none', msOverflowStyle: 'none' }}>
                                <TabItem icon="layers" label="All" active={activeCategory === "All"} onClick={() => setActiveCategory("All")} />
                                {categories.filter(c => c !== "All").map(cat => (
                                    <TabItem key={cat} icon="folder" label={cat} active={activeCategory === cat} onClick={() => setActiveCategory(cat)} />
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col overflow-hidden">

                        {/* Sub Header */}
                        <div className="h-12 bg-[#1e1e1e] flex items-center px-4 sm:px-8 border-b border-[#333333] shrink-0">
                            <span className="text-xs sm:text-sm text-gray-400 mr-3 hidden sm:inline">Applications on</span>
                            <select className="bg-[#2d2d30] border border-[#3e3e42] text-xs sm:text-sm text-white rounded px-2 py-1 focus:outline-none focus:border-green-500 cursor-pointer">
                                <option>base (root)</option>
                            </select>
                            <div className="ml-auto text-xs sm:text-sm text-gray-500">
                                {filteredApps.length} apps found
                            </div>
                        </div>

                        {/* Grid Area */}
                        <div className="p-4 sm:p-8 overflow-y-auto h-full">
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">
                                {filteredApps.map((app) => (
                                    <AppCard key={app.id} app={app} />
                                ))}
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root') as HTMLElement);
        root.render(<App />);
    </script>
</body>

</html>
