<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study App Navigator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.25.4/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        Babel.registerPreset('tsx', {
            presets: [
                [Babel.availablePresets['typescript'], { isTSX: true, allExtensions: true }],
                Babel.availablePresets['react']
            ]
        });
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #e0e0e0;
            margin: 0;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6B7280; }
    </style>
</head>

<body class="min-h-screen w-screen">
    <div id="root" class="w-full min-h-screen"></div>

    <script type="text/babel" data-presets="tsx">
        const { useState, useEffect } = React;

        interface AppItem {
            id: string;
            name: string;
            category: string;
            icon: string;
            appUrl: string;
        }

        const APP_DATA: AppItem[] = [
            // --- English ---
            { id: "english-word",       category: "English", name: "English Word",       icon: "BookOpen",       appUrl: "english_app/dist/index.html#/" },
            { id: "english-card",       category: "English", name: "English Card",       icon: "BookMarked",     appUrl: "english_app/dist/index.html#/english-card" },
            { id: "english-quiz",       category: "English", name: "English Quiz",       icon: "Brain",          appUrl: "english_app/dist/index.html#/english-quiz" },
            { id: "countable-nouns",    category: "English", name: "Countable Nouns",    icon: "Hash",           appUrl: "english_app/dist/index.html#/countable-nouns" },

            // --- Grammar ---
            { id: "grammar",            category: "Grammar", name: "Grammar Basic",      icon: "BookA",          appUrl: "english_app/dist/index.html#/grammar" },
            { id: "grammar-high",       category: "Grammar", name: "Grammar High",       icon: "GraduationCap",  appUrl: "english_app/dist/index.html#/grammar-high-school" },
            { id: "grammar-puzzle",     category: "Grammar", name: "Grammar Puzzle",     icon: "Puzzle",         appUrl: "english_app/dist/index.html#/grammar-puzzle" },
            { id: "grammar-structure",  category: "Grammar", name: "Grammar Structure",  icon: "Layers",         appUrl: "english_app/dist/index.html#/grammar-structure" },
            { id: "grammar-term",       category: "Grammar", name: "Grammar Term",       icon: "Type",           appUrl: "english_app/dist/index.html#/grammar-term" },
            { id: "grammar-train",      category: "Grammar", name: "Grammar Train",      icon: "Pencil",         appUrl: "english_app/dist/index.html#/grammar-train" },
            { id: "grammar-verb",       category: "Grammar", name: "Grammar Verb",       icon: "CheckSquare",    appUrl: "english_app/dist/index.html#/grammar-verb" },

            // --- Syntax ---
            { id: "modifiers",          category: "Syntax",  name: "Modifiers",          icon: "Scissors",       appUrl: "english_app/dist/index.html#/modifiers" },
            { id: "no-m-sentence",      category: "Syntax",  name: "No-M Sentence",      icon: "MessageSquare",  appUrl: "english_app/dist/index.html#/no-m-sentence" },
            { id: "no-m-puzzle",        category: "Syntax",  name: "No-M Puzzle",         icon: "Puzzle",         appUrl: "english_app/dist/index.html#/no-m-puzzle" },
            { id: "syntax-as-code",     category: "Syntax",  name: "Syntax as Code",     icon: "TerminalSquare", appUrl: "english_app/dist/index.html#/syntax-as-code" },
            { id: "syntax-parser",      category: "Syntax",  name: "Syntax Parser",      icon: "Network",        appUrl: "english_app/dist/index.html#/syntax-parser" },

            // --- Tools ---
            { id: "html-to-md",         category: "Tools",   name: "HTML to MD",         icon: "FileCode2",      appUrl: "tools_app/dist/index.html#/" },
            { id: "pdf-to-md",          category: "Tools",   name: "PDF to MD",          icon: "FileText",       appUrl: "tools_app/dist/index.html#/pdf" },
            { id: "wiki-to-md",         category: "Tools",   name: "Wiki to MD",         icon: "BookOpen",       appUrl: "tools_app/dist/index.html#/wiki" },
            { id: "json-downloader",    category: "Tools",   name: "JSON Downloader",    icon: "DownloadCloud",  appUrl: "tools_app/dist/index.html#/json-dl" },
            { id: "json-merger",        category: "Tools",   name: "JSON Merger",        icon: "GitMerge",       appUrl: "tools_app/dist/index.html#/json-merge" },
            { id: "legal-compiler",     category: "Tools",   name: "Legal Compiler",     icon: "Gavel",          appUrl: "tools_app/dist/index.html#/legal" },
        ];

        const AppIcon = ({ app }: { app: AppItem }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return (
                <a
                    href={app.appUrl}
                    target="_blank"
                    className="flex flex-col items-center gap-2 p-3 rounded-xl hover:bg-[#2a2a2b] transition-colors cursor-pointer no-underline group w-24 sm:w-28"
                >
                    <div className="w-14 h-14 sm:w-16 sm:h-16 bg-[#2d2d30] rounded-2xl flex items-center justify-center text-green-500 group-hover:scale-110 group-hover:bg-[#333333] transition-all shadow-lg">
                        <i data-lucide={app.icon} className="w-7 h-7 sm:w-8 sm:h-8"></i>
                    </div>
                    <span className="text-[11px] sm:text-xs text-gray-300 text-center leading-tight font-medium line-clamp-2 group-hover:text-white transition-colors">
                        {app.name}
                    </span>
                </a>
            );
        };

        const App = () => {
            const [activeCategory, setActiveCategory] = useState<string>("All");

            const categories = ["All", ...Array.from(new Set(APP_DATA.map(app => app.category)))];
            const filteredApps = activeCategory === "All" ? APP_DATA : APP_DATA.filter(app => app.category === activeCategory);

            useEffect(() => { lucide.createIcons(); });

            return (
                <div className="flex flex-col w-full min-h-screen bg-[#1e1e1e]">

                    {/* Header */}
                    <div className="w-full bg-[#181818] border-b border-[#333333] shrink-0">
                        <div className="h-14 flex items-center px-4 md:px-6">
                            <div className="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center mr-3 shadow-md shrink-0">
                                <span className="text-white font-bold text-lg leading-none">S</span>
                            </div>
                            <span className="text-base font-bold tracking-wide text-gray-100 mr-4 shrink-0">Study App</span>
                            <span className="text-xs text-gray-500 hidden sm:inline">{filteredApps.length} apps</span>
                        </div>
                    </div>

                    {/* Category Tabs */}
                    <div className="w-full bg-[#1e1e1e] border-b border-[#333333] shrink-0 px-4 md:px-6 overflow-x-auto" style={{ scrollbarWidth: 'none' }}>
                        <div className="flex gap-1 py-2">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setActiveCategory(cat)}
                                    className={`px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${
                                        activeCategory === cat
                                            ? 'bg-green-600 text-white'
                                            : 'bg-[#2d2d30] text-gray-400 hover:bg-[#3a3a3c] hover:text-gray-200'
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* App Grid */}
                    <div className="flex-1 p-4 sm:p-6 md:p-8">
                        {categories.filter(c => c !== "All").filter(c => activeCategory === "All" || activeCategory === c).map(cat => (
                            <div key={cat} className="mb-8">
                                <h2 className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4 px-1">{cat}</h2>
                                <div className="flex flex-wrap gap-2 sm:gap-4">
                                    {APP_DATA.filter(app => app.category === cat).map(app => (
                                        <AppIcon key={app.id} app={app} />
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root') as HTMLElement);
        root.render(<App />);
    </script>
</body>

</html>
